# Preços de mercado (decisões do dono em 18/10/2026), grátis:
# - café verde por nível (CEPEA e Carvalhaes, coletor/mercado.py): todo dia útil, 2 vezes (as cotações do mercado
#   físico saem uma vez por dia, com o fechamento; a de 18h47 pega o fechamento do dia, a de 7h13 o que saiu tarde);
# - varejo das marcas citadas nos editais (lojas online, coletor/varejo.py): uma vez por semana (segunda cedo).
# Cada parte que falhar mantém os valores anteriores; o que deu certo é publicado.
name: Atualizar preços de mercado

on:
  schedule:
    - cron: "13 10 * * 1-5" # 7h13 de Brasília, seg a sex: café verde (e varejo na segunda), antes da coleta das 8h07
    - cron: "47 21 * * 1-5" # 18h47 de Brasília, seg a sex: café verde com o fechamento do dia
  workflow_dispatch:

permissions:
  contents: write
  actions: write # pedir ao pages.yml que publique o site depois do commit

concurrency:
  group: atualizar-licitacoes # mesma fila da coleta diária: nunca as duas gravando ao mesmo tempo
  cancel-in-progress: false

jobs:
  varejo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Dia da semana (1 = segunda)
        run: echo "DIA_SEMANA=$(TZ=America/Sao_Paulo date +%u)" >> "$GITHUB_ENV"
      - name: Café verde por nível
        id: mercado
        continue-on-error: true
        run: .venv/bin/python -m coletor mercado
      - name: Varejo das marcas
        id: varejo
        # semanal: só na rodada das 7h13 de segunda (ou no botão "Run workflow")
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '13 10 * * 1-5' && env.DIA_SEMANA == '1')
        continue-on-error: true
        run: .venv/bin/python -m coletor varejo
      - name: Conferir dados gerados
        run: .venv/bin/python -m pytest -q tests/test_data.py
      - name: Publicar (commit na main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coletor/marcas_cafe.json coletor/mercado.json data.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza preços de mercado (café verde e varejo), $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            # Alguém pode enviar para a main entre o pull e o push (coleta, reserva): tenta até 3 vezes.
            enviado=0
            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then enviado=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Envio para a main falhou (tentativa $tentativa de 3); aguardando 20 s"
              sleep 20
            done
            if [ "$enviado" != 1 ]; then echo "::error::Não consegui enviar os preços para a main depois de 3 tentativas"; exit 1; fi
            # Commits feitos com o GITHUB_TOKEN não disparam outros workflows: pede ao pages.yml que publique.
            # Sem resposta 2xx o passo falha (e avisa): preços na main sem site novo passariam despercebidos.
            curl -sS -f -o /dev/null -w "Publicar site: HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}' || { echo "::error::O pages.yml não foi disparado: o site ficou com a versão anterior"; exit 1; }
          fi
      - name: Falhou alguma parte?
        if: steps.mercado.outcome == 'failure' || steps.varejo.outcome == 'failure'
        run: |
          echo "::error::Café verde: ${{ steps.mercado.outcome }}; varejo: ${{ steps.varejo.outcome }} (a parte que falhou manteve os valores anteriores)"
          exit 1
      - name: Avisar falha no Telegram
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -f -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Monitor de Licitações: a atualização dos preços de mercado falhou (café verde: ${{ steps.mercado.outcome == 'success' && 'ok' || steps.mercado.outcome == 'failure' && 'falhou' || 'não rodou' }}; varejo das marcas: ${{ steps.varejo.outcome == 'success' && 'ok' || steps.varejo.outcome == 'failure' && 'falhou' || 'não era hoje' }}). O que falhou segue com os valores anteriores e a data deles; se os dois deram certo, falhou o envio ou a publicação. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
