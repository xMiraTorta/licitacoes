# Envia no Telegram as licitações novas de uma coleta feita FORA do GitHub Actions (ex.: a reserva
# no Claude Code). Quem coletou grava avisos/pendentes.json e faz push; este workflow avisa e apaga o arquivo.
name: Avisar licitações novas

on:
  push:
    branches: [main]
    paths: [avisos/pendentes.json]
  workflow_dispatch:

permissions:
  contents: write

# Grupo próprio: no grupo da coleta, um aviso esperando na fila podia ser descartado pelo GitHub
# quando outro run entrasse na fila (só um pendente por grupo).
concurrency:
  group: avisar-licitacoes
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Endereço do site
        run: echo "PAINEL_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Avisar e limpar
        run: |
          if [ ! -f avisos/pendentes.json ]; then echo "Nada pendente."; exit 0; fi
          .venv/bin/python -m coletor avisar --novas avisos/pendentes.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q avisos/pendentes.json
          git commit -m "Avisos de licitações novas enviados no Telegram"
          git pull --rebase origin main
          git push origin HEAD:main
