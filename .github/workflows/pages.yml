# Publica o site no GitHub Pages. Desde 18/10/2026 a fonte do Pages é "GitHub Actions" (Settings > Pages):
# sem este workflow, nada do que vai para a main aparece no site.
# Monta o site (site/, React + Vite), junta o data.json e publica. Roda a cada mudança nos dados (coleta diária,
# preços de mercado), no código do site e no botão manual. Leva 1 a 2 min.
name: Publicar site

on:
  push:
    branches: [main]
    paths: [data.json, "site/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true # só a versão mais nova interessa

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Montar o site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Juntar os dados ao site
        run: cp data.json site/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
      # Este é o único caminho que põe dados novos no ar: se falhar (montagem, publicação), a coleta e os preços
      # continuam "verdes" na main e ninguém perceberia que o site parou no tempo. Não vale para cancelado:
      # com cancel-in-progress, uma publicação mais nova cancela a anterior de propósito.
      - name: Avisar falha no Telegram
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -f -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Monitor de Licitações: a publicação do site falhou; o site segue com a versão anterior até a próxima publicação dar certo. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
