# Preço de varejo das marcas citadas nos editais, uma vez por semana (decisão do dono em 18/10/2026).
# Busca pública das lojas online (coletor/varejo.py), ~2 min, grátis. Publica com commit na main.
name: Atualizar preços de varejo

on:
  schedule:
    - cron: "23 9 * * 1" # segunda 6h23 de Brasília, antes da coleta diária (8h07)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-licitacoes # mesma fila da coleta diária: nunca as duas gravando ao mesmo tempo
  cancel-in-progress: false

jobs:
  varejo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Atualizar preços de varejo
        run: .venv/bin/python -m coletor varejo
      - name: Conferir dados gerados
        run: .venv/bin/python -m pytest -q tests/test_data.py
      - name: Publicar (commit na main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coletor/marcas_cafe.json data.json index.html
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza preços de varejo das marcas – $(TZ=America/Sao_Paulo date '+%d/%m/%Y')"
            git pull --rebase origin main
            git push origin HEAD:main
            curl -sS -o /dev/null -w "Pages build: HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/pages/builds"
          fi
      - name: Avisar falha no Telegram
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -f -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ A atualização semanal dos preços de varejo das marcas falhou. O painel segue com os preços anteriores (com a data deles). Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
