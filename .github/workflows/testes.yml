# Testes automáticos em cada pedido de mudança (PR) e sob demanda. Sem acesso ao PNCP: só dados locais.
# Monta o site (site/) antes, porque os testes de página abrem a versão montada no Chromium.
name: Testes

on:
  pull_request:
    paths-ignore: # PR só de documentação não gasta minutos do Actions
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Montar e testar o site
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências e navegador
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
          .venv/bin/playwright install --with-deps chromium
      - name: Testes (coletor, dados e site)
        run: .venv/bin/python -m pytest -q
