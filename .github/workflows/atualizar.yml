# Coleta diária no PNCP, grava data.json na main (o pages.yml republica o site) e avisa no Telegram.
# Só roda a partir da branch padrão (main): agendamento e botão "Run workflow" do GitHub.
# Segredos (Settings > Secrets and variables > Actions): TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.
name: Atualizar licitações

on:
  schedule:
    - cron: "7 11 * * 1-5" # 8h07 de Brasília (UTC-3), seg a sex; a coleta leva ~1h no GitHub, aviso chega ~9h
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [coletar, descobrir-chat-telegram]
        default: coletar
      forcar:
        description: "Publicar mesmo se as travas de segurança dispararem"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # pedir ao pages.yml que publique o site depois do commit

concurrency:
  group: atualizar-licitacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 17/10/2026: 59 min com cache (o PNCP limita forte os servidores do GitHub)
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Endereço do site para o link do Telegram. github.event.repository vem vazio no agendamento,
      # então o nome sai de GITHUB_REPOSITORY ("dono/repo"); o domínio do Pages é em minúsculas.
      - name: Endereço do site
        run: echo "PAINEL_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Descobrir chat do Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.acao == 'descobrir-chat-telegram'
        run: .venv/bin/python -m coletor telegram-chat

      - name: Testes do coletor (sem internet)
        if: github.event_name == 'schedule' || inputs.acao == 'coletar'
        run: .venv/bin/python -m pytest -q tests/test_cafe.py tests/test_coletor.py tests/test_data.py

      - name: Coletar no PNCP
        if: github.event_name == 'schedule' || inputs.acao == 'coletar'
        run: .venv/bin/python -m coletor coletar --novas novas.json ${{ inputs.forcar && '--forcar' || '' }}

      - name: Conferir dados gerados
        if: github.event_name == 'schedule' || inputs.acao == 'coletar'
        run: .venv/bin/python -m pytest -q tests/test_data.py

      - name: Publicar (commit na main)
        if: github.event_name == 'schedule' || inputs.acao == 'coletar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json coletor/cache/sem_cafe.json
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
          else
            git commit -m "Atualiza licitações de café, $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') (Brasília)"
            # A coleta leva ~1 h; se a main mudou nesse tempo (outro commit), traz antes de enviar.
            # Conflito nos dados (ex.: a reserva já publicou) faz o passo falhar e avisa: não sobrescreve.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # O push de data.json dispara o pages.yml, que monta e publica o site (1 a 2 min). Commits feitos com o
          # GITHUB_TOKEN não disparam outros workflows: pede a execução pela API.
          curl -sS -o /dev/null -w "Publicar site: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Avisar no Telegram
        if: github.event_name == 'schedule' || inputs.acao == 'coletar'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram não configurado (faltam os segredos TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID). Dados publicados, aviso não enviado."
          else
            .venv/bin/python -m coletor avisar --novas novas.json
          fi

      # Também quando o job estoura o tempo ou é cancelado. O texto não afirma se houve publicação:
      # a falha pode ter sido antes (dados anteriores mantidos) ou depois (só o aviso falhou).
      - name: Avisar falha no Telegram
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -f -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Monitor de Licitações: a atualização de hoje falhou ou foi interrompida. Se não chegou a publicar, o painel segue com os dados anteriores; a reserva tenta de novo por volta de 10h40 (dias úteis). Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
